<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M mobile 개통 타이핑 시스템</title>
    <!-- PDF / JPG 생성 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; }
        body { margin: 0; padding: 10px; background-color: #d0d7de; color: #000; }

        /* 전체 레이아웃: 좌측 서식지 / 우측 입력 패널 */
        .container { display: flex; gap: 15px; max-width: 1700px; margin: 0 auto; height: calc(100vh - 65px); }

        /* [좌측] 공식 서식지 출력 영역 */
        .sheet-section { flex: 1.2; background: #525659; padding: 15px; border-radius: 4px; overflow: auto; display: flex; justify-content: center; }
        .paper-canvas { 
            position: relative; 
            width: 800px; 
            height: 1131px; 
            background-color: #fff; 
            background-image: url('ktm_1.jpg'); 
            background-size: 100% 100%; 
            background-repeat: no-repeat; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5); 
        }

        /* 서식지 오버레이 텍스트 및 V 체크 스타일 */
        .field { position: absolute; font-size: 12px; font-weight: bold; color: #000; white-space: nowrap; pointer-events: none; }
        .check-v { position: absolute; font-size: 15px; font-weight: 900; color: #000; pointer-events: none; }

        /* ========================================================= */
        /* [좌측 서식지 1:1 정밀 좌표 매핑] */
        /* ========================================================= */
        /* 체크표시 (V) 좌표 */
        #v_work_new     { top: 62px; left: 248px; } /* 업무구분: 신규 */
        #v_work_mnp     { top: 62px; left: 278px; } /* 업무구분: 이동 */
        #v_work_chg     { top: 62px; left: 308px; } /* 업무구분: 기변 */

        #v_cust_p       { top: 78px; left: 248px; } /* 고객구분: 개인 */
        #v_cust_b       { top: 78px; left: 278px; } /* 고객구분: 개인사업자 */
        #v_cust_c       { top: 78px; left: 318px; } /* 고객구분: 법인 */

        #v_gender_m     { top: 345px; left: 812px; } /* 성별: 남 */
        #v_gender_f     { top: 345px; left: 846px; } /* 성별: 여 */

        #v_bill_mms     { top: 416px; left: 216px; } /* 명세서: MMS */
        #v_bill_email   { top: 416px; left: 326px; } /* 명세서: 이메일 */
        #v_bill_giro    { top: 416px; left: 426px; } /* 명세서: 지로 */

        #v_pay_bank     { top: 440px; left: 110px; } /* 자동납부: 자동이체 */
        #v_pay_card     { top: 440px; left: 305px; } /* 자동납부: 신용카드 */

        /* 텍스트 데이터 좌표 */
        #f_name         { top: 350px; left: 180px; font-size: 13px; } /* 고객명 */
        #f_rrn          { top: 350px; left: 430px; font-size: 13px; } /* 주민번호 */
        #f_phone        { top: 372px; left: 180px; } /* 개통/연락처 */
        #f_email        { top: 372px; left: 430px; } /* 이메일 */
        #f_address      { top: 395px; left: 180px; } /* 주소 */

        #f_bankName     { top: 465px; left: 240px; } /* 은행/카드사명 */
        #f_payNum       { top: 465px; left: 430px; } /* 계좌/카드번호 */
        #f_payOwner     { top: 508px; left: 180px; } /* 예금주 */

        #f_model        { top: 122px; left: 715px; } /* 모델명 */
        #f_serial       { top: 140px; left: 715px; } /* 일련번호 */
        #f_price        { top: 115px; left: 130px; } /* 출고가 */
        #f_support      { top: 115px; left: 250px; } /* 공시지원금 */
        #f_principal    { top: 160px; left: 370px; } /* 할부원금 */
        #f_planName     { top: 250px; left: 110px; } /* 요금상품명 */
        #f_planFee      { top: 250px; left: 260px; } /* 월정액 요금 */
        #f_monthPay     { top: 312px; left: 730px; } /* 월 기본납부액 */

        #f_reqPhone     { top: 718px; left: 185px; } /* 번호이동 전화번호 */
        #f_prevOp       { top: 718px; left: 485px; } /* 변경 전 통신사 */

        #f_sellerName   { top: 38px; left: 810px; } /* 상담사/판매자 */

        /* [우측] 입력 컨트롤 패널 (엑셀 디자인 100% 재현) */
        .control-panel { flex: 0.8; background: #fff; border: 2px solid #000; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .panel-header { background: #000; color: #fff; padding: 6px 10px; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .btn-link { background: #000; color: #fff; border: 1px solid #fff; padding: 2px 8px; font-size: 11px; cursor: pointer; text-decoration: none; }

        .sec-header { background: #1f2a44; color: #fff; padding: 4px 8px; font-size: 12px; font-weight: bold; margin-top: 4px; }

        .ctrl-table { width: 100%; border-collapse: collapse; }
        .ctrl-table th, .ctrl-table td { border: 1px solid #777; padding: 3px 5px; font-size: 11px; }
        .ctrl-table th { background: #1f2a44; color: #fff; text-align: center; width: 25%; font-weight: normal; }
        .ctrl-table td { background: #fff; }
        .ctrl-table input, .ctrl-table select { width: 100%; border: none; outline: none; font-size: 11px; font-weight: bold; background: transparent; }

        /* 안내 문구 및 PDF 생성 버튼 */
        .info-box { background: #d9e1f2; border: 1px solid #8ea9db; padding: 8px; font-size: 11px; line-height: 1.4; color: #000; }
        .info-box ul { margin: 3px 0 0 15px; padding: 0; }

        .btn-pdf { background: #1f4e78; color: #fff; border: none; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 5px; }
        .btn-pdf:hover { background: #113355; }

        /* [하단] 통신사 서식지 선택 탭 바 */
        .bottom-tab-bar { height: 45px; background: #000; display: flex; align-items: center; padding: 0 10px; gap: 4px; overflow-x: auto; }
        .nav-tab { padding: 6px 12px; background: #0070c0; color: #fff; font-size: 11px; font-weight: bold; border-radius: 3px 3px 0 0; border: none; cursor: pointer; white-space: nowrap; }
        .nav-tab.active { background: #ffc000; color: #000; }
        .nav-tab.dark { background: #333; }

        @media print {
            body { padding: 0; background: #fff; }
            .control-panel, .bottom-tab-bar { display: none !important; }
            .container { display: block; }
            .sheet-section { padding: 0; background: #fff; }
            .paper-canvas { box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- [좌측] 공식 서식지 미리보기 (입력 시 실시간 글자 + V 체크 생성) -->
    <div class="sheet-section">
        <div class="paper-canvas" id="paperCanvas">
            <!-- V 체크 오버레이 -->
            <div class="check-v" id="v_work_new"></div>
            <div class="check-v" id="v_work_mnp"></div>
            <div class="check-v" id="v_work_chg"></div>

            <div class="check-v" id="v_cust_p"></div>
            <div class="check-v" id="v_cust_b"></div>
            <div class="check-v" id="v_cust_c"></div>

            <div class="check-v" id="v_gender_m"></div>
            <div class="check-v" id="v_gender_f"></div>

            <div class="check-v" id="v_bill_mms"></div>
            <div class="check-v" id="v_bill_email"></div>
            <div class="check-v" id="v_bill_giro"></div>

            <div class="check-v" id="v_pay_bank"></div>
            <div class="check-v" id="v_pay_card"></div>

            <!-- 텍스트 오버레이 -->
            <div class="field" id="f_name"></div>
            <div class="field" id="f_rrn"></div>
            <div class="field" id="f_phone"></div>
            <div class="field" id="f_email"></div>
            <div class="field" id="f_address"></div>

            <div class="field" id="f_bankName"></div>
            <div class="field" id="f_payNum"></div>
            <div class="field" id="f_payOwner"></div>

            <div class="field" id="f_model"></div>
            <div class="field" id="f_serial"></div>
            <div class="field" id="f_price"></div>
            <div class="field" id="f_support"></div>
            <div class="field" id="f_principal"></div>
            <div class="field" id="f_planName"></div>
            <div class="field" id="f_planFee"></div>
            <div class="field" id="f_monthPay"></div>

            <div class="field" id="f_reqPhone"></div>
            <div class="field" id="f_prevOp"></div>
            <div class="field" id="f_sellerName"></div>
        </div>
    </div>

    <!-- [우측] 입력 컨트롤 패널 (엑셀 디자인과 100% 동일) -->
    <div class="control-panel">
        <div class="panel-header">
            <span>M mobile이용신청서</span>
            <button class="btn-link">요금제 바로보기</button>
        </div>

        <!-- 요금제 & 유심정보 -->
        <div class="sec-header">▼ 요금제&유심정보</div>
        <table class="ctrl-table">
            <tr>
                <th>요금제선택</th>
                <td><input type="text" id="in_planName" value="5G M 프리미엄 200GB" oninput="syncAll()"></td>
                <th>유심비용</th>
                <td>
                    <select id="in_usimPay" onchange="syncAll()">
                        <option value="비구매">비구매</option>
                        <option value="선납">선납</option>
                        <option value="후청구">후청구</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>유심일련번호</th>
                <td><input type="text" id="in_usimSerial" placeholder="일련번호 입력" oninput="syncAll()"></td>
                <th>가입비 선택</th>
                <td>
                    <select id="in_joinFee" onchange="syncAll()">
                        <option value="일시불">일시불</option>
                        <option value="면제">면제</option>
                    </select>
                </td>
            </tr>
        </table>

        <!-- 고객정보 -->
        <div class="sec-header">▼ 고객정보</div>
        <table class="ctrl-table">
            <tr>
                <th>고객구분</th>
                <td>
                    <select id="in_custType" onchange="syncAll()">
                        <option value="개인">개인</option>
                        <option value="개인사업자">개인사업자</option>
                        <option value="법인">법인</option>
                    </select>
                </td>
                <th>성별</th>
                <td>
                    <select id="in_gender" onchange="syncAll()">
                        <option value="남">남</option>
                        <option value="여">여</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>가입자명</th>
                <td><input type="text" id="in_name" placeholder="가입자명 입력" oninput="syncAll()"></td>
                <th>생년월일</th>
                <td><input type="text" id="in_rrn" placeholder="주민번호 전체" oninput="syncAll()"></td>
            </tr>
            <tr>
                <th>주소</th>
                <td colspan="3"><input type="text" id="in_address" placeholder="주민등록상 주소" oninput="syncAll()"></td>
            </tr>
            <tr>
                <th>개통번호</th>
                <td><input type="text" id="in_phone" placeholder="010-0000-0000" oninput="syncAll()"></td>
                <th>연락처</th>
                <td><input type="text" id="in_subPhone" placeholder="비상연락처" oninput="syncAll()"></td>
            </tr>
            <tr>
                <th>개통구분</th>
                <td>
                    <select id="in_workType" onchange="syncAll()">
                        <option value="신규">신규가입</option>
                        <option value="번호이동" selected>번호이동</option>
                        <option value="기기변경">기기변경</option>
                    </select>
                </td>
                <th>이전통신사</th>
                <td>
                    <select id="in_prevOp" onchange="syncAll()">
                        <option value="SKT">SKT</option>
                        <option value="KT">KT</option>
                        <option value="LGU+" selected>LGU+</option>
                        <option value="알뜰폰">알뜰폰</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>명세서종류</th>
                <td colspan="3">
                    <select id="in_billType" onchange="syncAll()">
                        <option value="MMS">MMS</option>
                        <option value="이메일">이메일</option>
                        <option value="지로">지로</option>
                    </select>
                </td>
            </tr>
        </table>

        <!-- 자동이체 -->
        <div class="sec-header">▼ 자동이체</div>
        <table class="ctrl-table">
            <tr>
                <th>납부방식</th>
                <td colspan="3">
                    <select id="in_payMethod" onchange="syncAll()">
                        <option value="자동이체">자동이체(은행)</option>
                        <option value="신용카드">신용카드</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>예금주명</th>
                <td style="background:#800000; color:#fff; font-weight:bold; text-align:center;">예금주명 자필기재</td>
                <th>생년월일</th>
                <td><input type="text" id="in_payOwnerRrn" placeholder="생년월일" oninput="syncAll()"></td>
            </tr>
            <tr>
                <th>은행/카드사명</th>
                <td><input type="text" id="in_bankName" placeholder="KB국민은행" oninput="syncAll()"></td>
                <th>계좌/카드번호</th>
                <td><input type="text" id="in_payNum" placeholder="계좌번호" oninput="syncAll()"></td>
            </tr>
        </table>

        <!-- 부가기능 -->
        <div class="sec-header">▼ 부가기능</div>
        <table class="ctrl-table">
            <tr>
                <th>아무나결합</th>
                <td>
                    <select id="in_combine" onchange="syncAll()">
                        <option value="신청">신청</option>
                        <option value="미신청">미신청</option>
                    </select>
                </td>
                <th>캐치콜 신청</th>
                <td>
                    <select id="in_catchcall" onchange="syncAll()">
                        <option value="신청">신청</option>
                        <option value="미신청">미신청</option>
                    </select>
                </td>
            </tr>
        </table>

        <!-- 판매자정보 -->
        <div class="sec-header">▼ 판매자정보</div>
        <table class="ctrl-table">
            <tr>
                <th>판매점상호</th>
                <td><input type="text" id="in_storeName" placeholder="상호명" oninput="syncAll()"></td>
                <th>판매자명</th>
                <td><input type="text" id="in_sellerName" placeholder="상담사명" oninput="syncAll()"></td>
            </tr>
        </table>

        <!-- 안내문구 -->
        <div class="info-box">
            <b>※ 고객서명 및 판매자 서명 필수 자필로 기재 바랍니다</b>
            <ul>
                <li style="color:red; font-weight:bold;">필수 자필로 작성!!</li>
                <li style="color:blue; font-weight:bold;">5G 요금제 필수 자필로 작성!!</li>
                <li style="color:red; font-weight:bold;">제휴 요금제 필수 자필로 작성!!</li>
            </ul>
        </div>

        <!-- PDF / JPG 생성 버튼 -->
        <button class="btn-pdf" onclick="generatePDF()">PDF / JPG 생성</button>
    </div>
</div>

<!-- [하단] 서식지 전환 탭 바 -->
<div class="bottom-tab-bar">
    <button class="nav-tab active">엠모바일신청서</button>
    <button class="nav-tab">엠모바일(청소년)신청서</button>
    <button class="nav-tab">KTM(단말)</button>
    <button class="nav-tab">KTM(청소년단말)</button>
    <button class="nav-tab dark">스카이신청서</button>
    <button class="nav-tab dark">스테이지신청서</button>
    <button class="nav-tab" style="background:#002060;">프리티LG신청서</button>
    <button class="nav-tab" style="background:#ff0000;">프리티SK신청서</button>
    <button class="nav-tab dark">U모바일후불요금제</button>
</div>

<script>
    // 오버레이 및 V 체크 실시간 매핑 함수
    function syncAll() {
        // 1. V 체크박스 초기화
        const checkIds = ['v_work_new', 'v_work_mnp', 'v_work_chg', 'v_cust_p', 'v_cust_b', 'v_cust_c', 'v_gender_m', 'v_gender_f', 'v_bill_mms', 'v_bill_email', 'v_bill_giro', 'v_pay_bank', 'v_pay_card'];
        checkIds.forEach(id => document.getElementById(id).innerText = '');

        // 2. 업무구분 체크
        const workType = document.getElementById('in_workType').value;
        if (workType === '신규') document.getElementById('v_work_new').innerText = 'V';
        else if (workType === '번호이동') document.getElementById('v_work_mnp').innerText = 'V';
        else if (workType === '기기변경') document.getElementById('v_work_chg').innerText = 'V';

        // 3. 고객구분 체크
        const custType = document.getElementById('in_custType').value;
        if (custType === '개인') document.getElementById('v_cust_p').innerText = 'V';
        else if (custType === '개인사업자') document.getElementById('v_cust_b').innerText = 'V';
        else if (custType === '법인') document.getElementById('v_cust_c').innerText = 'V';

        // 4. 성별 체크
        const gender = document.getElementById('in_gender').value;
        if (gender === '남') document.getElementById('v_gender_m').innerText = 'V';
        else if (gender === '여') document.getElementById('v_gender_f').innerText = 'V';

        // 5. 명세서종류 체크
        const billType = document.getElementById('in_billType').value;
        if (billType === 'MMS') document.getElementById('v_bill_mms').innerText = 'V';
        else if (billType === '이메일') document.getElementById('v_bill_email').innerText = 'V';
        else if (billType === '지로') document.getElementById('v_bill_giro').innerText = 'V';

        // 6. 자동납부 체크
        const payMethod = document.getElementById('in_payMethod').value;
        if (payMethod === '자동이체') document.getElementById('v_pay_bank').innerText = 'V';
        else if (payMethod === '신용카드') document.getElementById('v_pay_card').innerText = 'V';

        // 7. 텍스트 필드 값 매핑
        document.getElementById('f_name').innerText = document.getElementById('in_name').value;
        document.getElementById('f_rrn').innerText = document.getElementById('in_rrn').value;
        document.getElementById('f_phone').innerText = document.getElementById('in_phone').value;
        document.getElementById('f_address').innerText = document.getElementById('in_address').value;
        document.getElementById('f_planName').innerText = document.getElementById('in_planName').value;
        document.getElementById('f_bankName').innerText = document.getElementById('in_bankName').value;
        document.getElementById('f_payNum').innerText = document.getElementById('in_payNum').value;
        document.getElementById('f_payOwner').innerText = document.getElementById('in_payOwner').value ? document.getElementById('in_payOwner').value : '';
        document.getElementById('f_prevOp').innerText = document.getElementById('in_prevOp').value;
        document.getElementById('f_sellerName').innerText = document.getElementById('in_sellerName').value;
    }

    // PDF / JPG 이미지 생성 다운로드
    function generatePDF() {
        const name = document.getElementById('in_name').value || '신청서';
        const canvas = document.getElementById('paperCanvas');

        html2canvas(canvas, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(cvs => {
            const link = document.createElement('a');
            link.download = `Mmobile_신청서_${name}.jpg`;
            link.href = cvs.toDataURL('image/jpeg', 0.95);
            link.click();
        });
    }

    // 최초 실행 시 매핑 실행
    window.onload = syncAll;
</script>

</body>
</html>
