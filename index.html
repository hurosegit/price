<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보안 정책표 접속</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #f5f5f5; }
        .login-box { text-align: center; padding-top: 100px; }
        .box { background: white; padding: 40px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 10px; font-size: 16px; width: 200px; text-align: center; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 5px; }
        #sheet-frame { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>
    <div id="login-view" class="login-box">
        <div class="box">
            <h2>🔒 에셀트리 보안 정책실</h2>
            <p>인증 비밀번호 4자리를 입력하세요.</p>
            <input type="password" id="pw" placeholder="비밀번호 입력">
            <button onclick="checkPw()">확인</button>
        </div>
    </div>

    <!-- 비밀번호 성공 시 시트가 뜰 화면 -->
    <iframe id="sheet-frame"></iframe>

    <script>
        function checkPw() {
            var input = document.getElementById('pw').value;
            
            var realPassword = "7000"; 
            // 💡 구글시트에서 [파일] -> [공유] -> [웹에 게시] 한 링크나 게시용 HTML 주소를 넣으면 더 깔끔합니다.
            var googleSheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT-Kp6-DZwwFn6g1r4ABusqkM3YWFxDeFfDt1-o_ukG_b2HlMngrgcVy8EPCAVdEDqYEASGiVo1BO7P/pubhtml"; 

            if(input === realPassword) {
                document.getElementById('login-view').style.display = 'none';
                var iframe = document.getElementById('sheet-frame');
                iframe.src = googleSheetUrl;
                iframe.style.display = 'block';
            } else {
                alert("비밀번호가 올바르지 않습니다. 대리점으로 문의하세요.");
            }
        }
    </script>
</body>
</html>
