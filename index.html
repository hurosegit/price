<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>보안 정책표 접속</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; background: #f5f5f5; }
        .box { background: white; padding: 40px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 10px; font-size: 16px; width: 200px; text-align: center; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 에셀트리 보안 정책실</h2>
        <p>인증 비밀번호 4자리를 입력하세요.</p>
        <input type="password" id="pw" placeholder="비밀번호 입력">
        <button onclick="checkPw()">확인</button>
    </div>

    <script>
        function checkPw() {
            var input = document.getElementById('pw').value;
            
            // 💡 비밀번호와 구글시트 주소를 실제 값으로 바꿔주세요!
            var realPassword = "7000"; 
            var googleSheetUrl = "https://docs.google.com/spreadsheets/d/1StPDVgApp85540TRoGZjwSwDyYueWd9wLD6ok7qu5nE/edit?usp=sharing"; 

            if(input === realPassword) {
                location.href = googleSheetUrl;
            } else {
                alert("비밀번호가 올바르지 않습니다. 대리점으로 문의하세요.");
            }
        }
    </script>
</body>
</html>
