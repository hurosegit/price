<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에셀트리 보안 정책실 - 단가표 및 개통신청</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* [공통] 기본 스타일 */
        body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; background: #f0f2f5; min-height: 100vh; }
        
        /* [1] 로그인 화면 */
        #login-view { text-align: center; width: 100%; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: white; padding: 50px 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .login-box h2 { margin-top: 0; color: #333; font-size: 24px; margin-bottom: 10px; }
        .login-box p { color: #666; margin-bottom: 30px; }
        .login-box input { padding: 15px; font-size: 18px; width: 240px; text-align: center; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        .login-box input:focus { outline: none; border-color: #007bff; }
        .login-box button { padding: 15px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; display: block; width: 100%; font-weight: bold; }
        .login-box button:hover { background: #0056b3; }
        .login-box .hint { font-size: 14px; color: #999; margin-top: 25px; margin-bottom: 0; }

        /* [2] 단가표 화면 */
        #price-view { display: none; text-align: center; padding: 30px 15px; width: 100%; max-width: 900px; margin: 0 auto; box-sizing: border-box; }
        .page-header { background: #fff; padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 20px; margin-top: 25px; border-left: 5px solid #007bff; text-align: left; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .page-header:first-child { margin-top: 0; }
        .page-header h1 { margin: 0; font-size: 20px; color: #333; flex-grow: 1; }
        .btn-apply { background: #28a745; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); white-space: nowrap; }
        .btn-apply:hover { background: #218838; transform: translateY(-1px); }
        #price-view img { max-width: 100%; height: auto; border-radius: 10px; box-shadow: 0 6px 15px rgba(0,0,0,0.07); margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; cursor: zoom-in; }

        /* [3] 개통 신청 전용 독립 페이지 */
        #apply-view { display: none; width: 100%; max-width: 1100px; margin: 0 auto; padding: 30px 15px; box-sizing: border-box; }
        .apply-card { background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .apply-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; }
        .apply-header h2 { margin: 0; font-size: 22px; color: #333; }
        .btn-back { background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-back:hover { background: #5a6268; }

        .apply-section-header { background: #f8f9fa; padding: 12px 18px; border-radius: 8px; border-left: 5px solid #007bff; margin-bottom: 15px; }
        .apply-section-header h3 { margin: 0; font-size: 16px; color: #333; }
        
        .example-container { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; }
        .example-container img { height: 180px; border-radius: 6px; border: 1px solid #ddd; cursor: zoom-in; transition: transform 0.2s; }
        .example-container img:hover { transform: scale(1.02); }

        .form-workspace { display: flex; gap: 20px; flex-wrap: wrap; }
        .thumbs-sidebar { display: flex; flex-direction: column; gap: 12px; width: 140px; }
        .thumb-box { text-align: center; font-size: 12px; color: #666; font-weight: bold; cursor: pointer; }
        .thumb-img { width: 100%; border-radius: 6px; border: 2px solid #ddd; transition: all 0.2s; background: #fff; }
        .thumb-img.active { border-color: #007bff; box-shadow: 0 0 8px rgba(0,123,255,0.5); }
        
        .form-inputs { flex: 1; min-width: 280px; background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .form-group input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        /* 성별 라디오 버튼 스타일 */
        .gender-options { display: flex; gap: 20px; padding-top: 8px; }
        .gender-options label { font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .gender-options input { width: 16px; height: 16px; cursor: pointer; }

        .btn-submit { background: #007bff; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        .btn-submit:hover { background: #0056b3; }

        .preview-area { margin-top: 25px; text-align: center; background: #e9ecef; padding: 20px; border-radius: 8px; }
        .preview-area canvas { max-width: 100%; height: auto; border: 1px solid #ccc; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: #fff; }

        /* [4] 이미지 확대용 전용 팝업 모달 */
        .modal { display: none; position: fixed; z-index: 99999; left: 0; top: 0; width: 100%; height: 100%; overflow-y: auto; background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { margin: 40px auto; display: block; width: 95%; max-width: 1100px; height: auto; border-radius: 6px; }
        .close-btn { position: fixed; top: 15px; right: 20px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 100000; text-shadow: 0 0 10px #000; background: rgba(0,0,0,0.5); width: 45px; height: 45px; line-height: 40px; text-align: center; border-radius: 50%; }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            .thumbs-sidebar { flex-direction: row; width: 100%; overflow-x: auto; }
            .thumb-box { width: 75px; flex-shrink: 0; }
        }
    </style>
</head>
<body onload="initTodayDate()">

    <!-- [1] 로그인 화면 -->
    <div id="login-view">
        <div class="login-box">
            <h2>🔒 에셀트리 보안 정책실</h2>
            <p>인증 비밀번호 4자리를 입력하세요.</p>
            <form action="javascript:void(0);" onsubmit="checkPw(); return false;">
                <input type="password" id="pw" placeholder="비밀번호 입력" required autofocus>
                <button type="button" onclick="checkPw()">확인</button>
            </form>
            <p class="hint">문의: 이상진 과장 010-5707-7000</p>
        </div>
    </div>

    <!-- [2] 단가표 화면 -->
    <div id="price-view">
        <div class="page-header">
            <h1>KT MNO 외국인전용 정책표</h1>
            <button class="btn-apply" onclick="showApplyPage()">개통하러 가기 🚀</button>
        </div>
        <img src="price_01.png" alt="에셀트리 단가표 1" onclick="openModal(this)">

        <div class="page-header">
            <h1>LG MNO 외국인전용 정책표</h1>
            <button class="btn-apply" onclick="showApplyPage()">개통하러 가기 🚀</button>
        </div>
        <img src="price_02.png" alt="에셀트리 단가표 2" onclick="openModal(this)">

        <div class="page-header">
            <h1>알뜰모바일 대기업 자회사</h1>
            <button class="btn-apply" onclick="showApplyPage()">개통하러 가기 🚀</button>
        </div>
        <img src="price_03.png" alt="에셀트리 단가표 3" onclick="openModal(this)">

        <div class="page-header">
            <h1>알뜰모바일 중소기업</h1>
            <button class="btn-apply" onclick="showApplyPage()">개통하러 가기 🚀</button>
        </div>
        <img src="price_04.png" alt="에셀트리 단가표 4" onclick="openModal(this)">

        <div class="page-header">
            <h1>KT M모바일 A175 단말기</h1>
            <button class="btn-apply" onclick="showApplyPage()">개통하러 가기 🚀</button>
        </div>
        <img src="price_05.png" alt="에셀트리 단가표 5" onclick="openModal(this)">

        <div class="page-header">
            <h1>선불</h1>
            <button class="btn-apply" onclick="showApplyPage()">개통하러 가기 🚀</button>
        </div>
        <img src="price_06.png" alt="에셀트리 단가표 6" onclick="openModal(this)">
    </div>

    <!-- [3] 개통 작성 독립 페이지 -->
    <div id="apply-view">
        <div class="apply-card">
            <div class="apply-header">
                <h2>📝 개통 신청서 작성</h2>
                <button class="btn-back" onclick="showPricePage()">◀ 단가표로 돌아가기</button>
            </div>

            <!-- 작성 예시 영역 -->
            <div class="apply-section-header">
                <h3>📖 작성예시 (이미지를 클릭하면 크게 확대됩니다)</h3>
            </div>
            <div class="example-container">
                <img src="1.jpg" alt="작성예시 1" onclick="openModal(this)">
                <img src="2.jpg" alt="작성예시 2" onclick="openModal(this)">
                <img src="3.jpg" alt="작성예시 3" onclick="openModal(this)">
                <img src="4.jpg" alt="작성예시 4" onclick="openModal(this)">
            </div>

            <!-- 서식지 입력 영역 -->
            <div class="apply-section-header">
                <h3>✍️ 서식지 정보 입력</h3>
            </div>
            <div class="form-workspace">
                <!-- 원본 서식지 선택 사이드바 -->
                <div class="thumbs-sidebar">
                    <div class="thumb-box" onclick="selectForm(1)">
                        <img src="form_01.jpg" class="thumb-img active" id="thumb1" onerror="this.src='1.jpg'">
                        <span>1. KT 서비스신청서</span>
                    </div>
                    <div class="thumb-box" onclick="selectForm(2)">
                        <img src="form_02.jpg" class="thumb-img" id="thumb2" onerror="this.src='2.jpg'">
                        <span>2. KT 무선신청서</span>
                    </div>
                    <div class="thumb-box" onclick="selectForm(3)">
                        <img src="form_03.jpg" class="thumb-img" id="thumb3" onerror="this.src='3.jpg'">
                        <span>3. 개인정보동의(1)</span>
                    </div>
                    <div class="thumb-box" onclick="selectForm(4)">
                        <img src="form_04.jpg" class="thumb-img" id="thumb4" onerror="this.src='4.jpg'">
                        <span>4. 개인정보동의(2)</span>
                    </div>
                </div>

                <!-- 정보 입력 폼 -->
                <div class="form-inputs">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>고객성명</label>
                            <input type="text" id="custName" placeholder="홍길동" oninput="renderCanvas()">
                        </div>
                        <div class="form-group">
                            <label>성별 선택</label>
                            <div class="gender-options">
                                <label><input type="radio" name="gender" value="M" checked onchange="renderCanvas()"> 남성 (3번 체크)</label>
                                <label><input type="radio" name="gender" value="F" onchange="renderCanvas()"> 여성 (4번 체크)</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>생년월일 / 외국인등록번호 앞자리</label>
                            <input type="text" id="custBirth" placeholder="011129" oninput="renderCanvas()">
                        </div>
                        <div class="form-group full">
                            <label>주소</label>
                            <input type="text" id="custAddr" placeholder="서울시 중구 장충단로..." oninput="renderCanvas()">
                        </div>
                        <div class="form-group">
                            <label>자동이체 (은행/카드사명)</label>
                            <input type="text" id="bankName" placeholder="하나은행" oninput="renderCanvas()">
                        </div>
                        <div class="form-group">
                            <label>계좌번호 / 카드번호</label>
                            <input type="text" id="bankNum" placeholder="123-456-7890" oninput="renderCanvas()">
                        </div>
                        <div class="form-group">
                            <label>판매자(점주명)</label>
                            <input type="text" id="sellerName" placeholder="사가르" oninput="renderCanvas()">
                        </div>
                        <div class="form-group">
                            <label>신청일자 (기본 오늘날짜)</label>
                            <input type="text" id="applyDate" placeholder="YYYY.MM.DD" oninput="renderCanvas()">
                        </div>
                    </div>

                    <button class="btn-submit" onclick="downloadAllJPGs()">📥 작성 완료 및 서식지 4장 JPG 일괄 다운로드</button>
                </div>
            </div>

            <!-- 실시간 자동 합성 미리보기 -->
            <div class="preview-area">
                <p style="margin: 0 0 10px 0; font-size:13px; color:#555; font-weight:bold;">[실시간 서식지 자동 작성 미리보기]</p>
                <canvas id="formCanvas" width="1200" height="1600"></canvas>
            </div>
        </div>
    </div>

    <!-- [4] 이미지 확대용 전용 팝업 모달 -->
    <div id="imageModal" class="modal" onclick="closeModal(event)">
        <span class="close-btn" onclick="closeModal(event)">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        var currentFormIdx = 1;
        let debugMode = true;

        // 오늘 날짜 세팅
        function initTodayDate() {
            var today = new Date();
            var yyyy = today.getFullYear();
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var dd = String(today.getDate()).padStart(2, '0');
            var formattedToday = yyyy + "." + mm + "." + dd;
            
            var dateInput = document.getElementById("applyDate");
            if(dateInput && !dateInput.value) {
                dateInput.value = formattedToday;
            }
        }

        // 비밀번호 체크
        function checkPw() {
            var input = document.getElementById('pw').value;
            if(input === "7000") {
                document.getElementById('login-view').style.setProperty('display', 'none', 'important');
                showPricePage();
            } else {
                alert("비밀번호가 올바르지 않습니다. 이상진과장 010-5707-7000으로 문의하세요.");
                document.getElementById('pw').value = "";
                document.getElementById('pw').focus();
            }
        }

        // 페이지 전환 함수
        function showPricePage() {
            document.getElementById('price-view').style.display = 'block';
            document.getElementById('apply-view').style.display = 'none';
            window.scrollTo(0, 0);
        }

        function showApplyPage() {
            document.getElementById('price-view').style.display = 'none';
            document.getElementById('apply-view').style.display = 'block';
            window.scrollTo(0, 0);
            initTodayDate();
            selectForm(1);
        }

        // 이미지 확대 모달
        function openModal(imgElement) {
            var modal = document.getElementById("imageModal");
            var modalImg = document.getElementById("modalImg");
            modal.style.display = "block";
            modalImg.src = imgElement.src;
            modal.scrollTop = 0;
        }

        function closeModal(event) {
            if (!event || event.target.id === "imageModal" || event.target.className === "close-btn") {
                document.getElementById("imageModal").style.display = "none";
            }
        }

        // 썸네일 선택
        function selectForm(idx) {
            currentFormIdx = idx;
            for(var i=1; i<=4; i++) {
                var thumb = document.getElementById("thumb" + i);
                if(thumb) thumb.classList.remove("active");
            }
            var activeThumb = document.getElementById("thumb" + idx);
            if(activeThumb) activeThumb.classList.add("active");
            renderCanvas();
        }

        // Canvas 실시간 도면화
function renderCanvas() {
    var canvas = document.getElementById("formCanvas");
    var ctx = canvas.getContext("2d");

    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 입력값 취득
    var name = document.getElementById("custName").value || "홍길동";
    var birth = document.getElementById("custBirth").value || "011129";
    var addr = document.getElementById("custAddr").value || "서울시 중구 장충단로...";
    var bank = document.getElementById("bankName").value || "하나은행";
    var bankNum = document.getElementById("bankNum").value || "123-456-7890";
    var seller = document.getElementById("sellerName").value || "사가르";
    var dateStr = document.getElementById("applyDate").value;
    
    // 성별 라디오 선택값 확인 ('M' 또는 'F')
    var genderRadios = document.getElementsByName("gender");
    var selectedGender = "M";
    for(var i=0; i<genderRadios.length; i++) {
        if(genderRadios[i].checked) {
            selectedGender = genderRadios[i].value;
            break;
        }
    }

    var img = new Image();
    img.crossOrigin = "Anonymous";
    img.src = "form_0" + currentFormIdx + ".jpg";
    
    img.onload = function() {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        ctx.font = "bold 20px 'Malgun Gothic'";
        ctx.fillStyle = "#111111";

        // 📌 1번 서식지 (KT 서비스신청서) 정밀 좌표 교정
        if (currentFormIdx === 1) {
            
            // --- 1. 최상단 무조건 체크표시 박스 (1번, 2번) ---
            ctx.font = "bold 18px 'Malgun Gothic'";
            ctx.fillText("✔", 751, 99);   // 1번 박스: MOBILE 신규
            ctx.fillText("✔", 1045, 95);  // 2번 박스: 고객구분 본인

            // --- 2. 통신범죄 예방안내 우측 서명란 ---
            ctx.font = "bold 20px 'Malgun Gothic'";
            ctx.fillText(seller, 904, 160); // 판매자(본인)
            ctx.fillText(name, 904, 210);   // 신청/가입자(본인) 1
            ctx.fillText(name, 904, 269);   // 신청/가입자(본인) 2

            // --- 3. 결합서비스신청 하단 대리인 서명 ---
            ctx.fillText(name, 950, 720);   // 신청/가입자(대리인)

            // --- 4. 고객정보 섹션 ---
            ctx.fillText(name, 276, 792);   // 고객명
            ctx.fillText(birth, 565, 780);  // 생년월일

            // 성별 체크 (3번: 남 / 4번: 여)
            ctx.font = "bold 18px 'Malgun Gothic'";
            if (selectedGender === "M") {
                ctx.fillText("✔", 834, 778); // 3번 박스 (남)
            } else {
                ctx.fillText("✔", 869, 778); // 4번 박스 (여)
            }
            ctx.font = "bold 20px 'Malgun Gothic'";

            ctx.fillText(addr, 277, 848);   // 주소(설치)

            // --- 5. 복지할인 (5번: 해당없음) ---
            ctx.font = "bold 18px 'Malgun Gothic'";
            ctx.fillText("✔", 497, 962);   // 5번 박스 (해당없음)
            ctx.font = "bold 20px 'Malgun Gothic'";

            // --- 6. 요금납부 섹션 ---
            ctx.fillText(name, 526, 1050);                  // 예금주/카드주
            ctx.fillText(birth, 1006, 1051);                 // 생년월일
            ctx.fillText(bank + " / " + bankNum, 630, 1080); // 은행명 / 계좌번호
            ctx.fillText(name, 849, 1201);                  // 자동/통합 납부 동의 서명

            // --- 7. 최하단 날짜 / 판매자 / 고객 서명 ---
            ctx.fillText(dateStr, 120, 1475); // 오늘날짜
            ctx.fillText(seller, 120, 1500);  // 판매자 이름
            ctx.fillText(name, 913, 1499);    // 신청/가입자 서명
        } 
        else if (currentFormIdx === 2) {
            ctx.fillText(name, 770, 335);
            ctx.fillText(name, 770, 905);
            ctx.fillText(dateStr, 200, 905);
        } 
        else if (currentFormIdx === 3) {
            ctx.fillText(name, 800, 160);
            ctx.fillText(name, 800, 252);
            ctx.fillText(name, 800, 505);
        } 
        else if (currentFormIdx === 4) {
            ctx.fillText(name, 800, 130);
            ctx.fillText(name, 800, 380);
            ctx.fillText(name, 800, 890);
        }
    };

    img.onerror = function() {
        var retryImg = new Image();
        retryImg.crossOrigin = "Anonymous";
        retryImg.src = currentFormIdx + ".jpg";
        retryImg.onload = function() {
            ctx.drawImage(retryImg, 0, 0, canvas.width, canvas.height);
        };
    };
}
        const canvas = document.getElementById("formCanvas");

canvas.addEventListener("click", function(e){

    if(!debugMode) return;

    const rect = canvas.getBoundingClientRect();

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const x = Math.round((e.clientX - rect.left) * scaleX);
    const y = Math.round((e.clientY - rect.top) * scaleY);

    alert("X=" + x + "\nY=" + y);

});

        // JPG 일괄 다운로드
        function downloadAllJPGs() {
            var canvas = document.getElementById("formCanvas");
            var name = document.getElementById("custName").value || "고객";
            
            alert(name + "님의 서식지 4장이 순차적으로 JPG 파일로 다운로드됩니다.");

            var savedIdx = currentFormIdx;
            var formList = [1, 2, 3, 4];
            var delay = 0;

            formList.forEach(function(idx) {
                setTimeout(function() {
                    currentFormIdx = idx;
                    renderCanvas();
                    
                    setTimeout(function() {
                        var link = document.createElement('a');
                        link.download = name + "_개통서식지_0" + idx + ".jpg";
                        link.href = canvas.toDataURL('image/jpeg', 0.95);
                        link.click();

                        if (idx === 4) {
                            selectForm(savedIdx);
                        }
                    }, 300);
                }, delay);
                delay += 800;
            });
        }
